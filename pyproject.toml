[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "scorecard"
version = "0.1.0"
requires-python = ">=3.10"
# Pinned: newer numpy/pandas builds are blocked by Smart App Control on the dev laptop.
dependencies = [
  "numpy==1.26.4", "pandas==2.2.3", "scikit-learn==1.5.2",
  "lightgbm==4.5.0", "scipy==1.13.1", "matplotlib==3.11.2", "pyyaml==6.0.3",
]

[project.optional-dependencies]
# Serving only (D-024): the training pipeline never imports these.
api = [
  "fastapi==0.165.0", "pydantic==2.14.4", "uvicorn==0.54.0",
  # SQLAlchemy 2.0, not 2.1: 2.1 hard-imports its compiled extension, which Smart App
  # Control blocks on the dev laptop; 2.0 falls back to pure Python (D-025).
  "sqlalchemy==2.0.58", "alembic==1.20.1",
]
postgres = ["psycopg[binary]==3.3.9"]  # Postgres driver, used inside the Docker image (D-026)
# Pinned so pre-commit, CI and the laptop run identical tool versions (D-027).
dev = [
  "pytest==9.2.0", "ruff==0.17.5", "pre-commit==4.7.0", "pre-commit-hooks==6.0.0",
  "ipykernel==7.4.0",
  "httpx==0.28.1",  # FastAPI TestClient
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
