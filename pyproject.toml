[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "scorecard"
version = "0.1.0"
requires-python = ">=3.10"
# Pinned: newer numpy/pandas builds are blocked by Smart App Control on the dev laptop.
dependencies = [
  "numpy==1.26.4", "pandas==2.2.3", "scikit-learn==1.5.2",
  "lightgbm==4.5.0", "scipy==1.13.1", "matplotlib", "pyyaml",
]

[project.optional-dependencies]
dev = ["pytest", "ruff", "pre-commit", "ipykernel"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
