# CI (D-027): every push to main and every pull request.
#   1. checks  - pre-commit hooks (ruff, whitespace, secrets, data guard) + all tests
#   2. docker  - build the image, start Postgres + migrate + API, smoke test,
#                and prove the API's database role cannot UPDATE the audit log
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read  # least privilege: CI only reads the repo

concurrency:  # a newer push to the same branch cancels the older, now-pointless run
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      # Actions pinned to a commit SHA, not a movable tag: a hijacked tag cannot
      # inject code into this pipeline (supply-chain hardening).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: python -m pip install -e ".[api,dev,app]"
      - name: Pre-commit hooks (lint, format, file hygiene, secrets, data guard)
        run: python -m pre_commit run --all-files --show-diff-on-failure
      - name: Tests
        env:
          SCORECARD_REQUIRE_ARTIFACTS: "1"  # missing model files fail the run, never skip
        run: python -m pytest -q -rs  # -rs prints every skip and its reason

  docker:
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"
      - name: Throwaway secrets for this run only
        run: |
          {
            echo "POSTGRES_PASSWORD=$(openssl rand -hex 16)"
            echo "SCORECARD_OWNER_PASSWORD=$(openssl rand -hex 16)"
            echo "SCORECARD_APP_PASSWORD=$(openssl rand -hex 16)"
            echo "IMAGE_TAG=ci-${GITHUB_SHA::12}"
          } > .env
      - name: Build and start the stack
        run: make up
      - name: Smoke test + database privilege check
        run: make smoke
      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color
      - name: Tear down
        if: always()
        run: docker compose down -v
